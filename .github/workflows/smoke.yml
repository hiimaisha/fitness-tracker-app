name: App smoke check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py
      - name: Smoke test Streamlit page
        run: python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('app.py').run(timeout=30); assert not app.exception, app.exception"
